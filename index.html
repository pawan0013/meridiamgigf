<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northstar Investment Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary-900:#052F26;--primary-800:#0B4638;--primary-700:#0B5A3E;
  --accent-600:#00A995;--accent-500:#00BFAE;--accent-100:#DDF5EE;--accent-050:#EFF9F5;
  --page:#F4F7F5;--surface:#FFFFFF;
  --warn:#B76B00;--warn-bg:#FFF3DD;--danger:#A83A32;--danger-bg:#FBEAE7;
  --info:#326B8A;--info-bg:#E8F3F8;
  --t900:#0F1F1B;--t600:#374B44;--t400:#637B72;--t200:#99B0A8;
  --border:#C8D8D2;--border-light:#E2EDE8;
  --sidebar-w:256px;--topbar-h:56px;--drawer-w:580px;--modal-w:520px;
  --r-sm:4px;--r-md:8px;--r-lg:12px;
}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;font-size:14px;color:var(--t900)}
body{display:flex;height:100vh;overflow:hidden;background:var(--page)}
#app{display:flex;flex:1;height:100vh;overflow:hidden;min-width:0}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--primary-900);color:#fff;display:flex;flex-direction:column;height:100vh;overflow-y:auto;overflow-x:hidden;z-index:50;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.sb-header{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sb-mark{width:28px;height:28px;background:var(--accent-600);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.sb-name{font-size:12px;font-weight:600;color:#fff;line-height:1.25}
.demo-badge{font-size:9px;font-weight:600;letter-spacing:.06em;color:var(--accent-500);background:rgba(0,191,174,.1);border:1px solid rgba(0,191,174,.22);border-radius:3px;padding:2px 7px;display:inline-block;text-transform:uppercase}
.nav-section{padding:14px 10px 2px}
.nav-label{font-size:9px;font-weight:600;letter-spacing:.08em;color:rgba(255,255,255,.3);text-transform:uppercase;padding:0 8px;margin-bottom:3px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;color:rgba(255,255,255,.65);font-size:12.5px;font-weight:450;transition:background .12s,color .12s;margin-bottom:1px;position:relative;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.92)}
.nav-item.active{background:rgba(0,191,174,.16);color:var(--accent-500);font-weight:500}
.nav-icon{width:15px;height:15px;flex-shrink:0;opacity:.85}
.nav-badge{margin-left:auto;background:var(--accent-600);color:#fff;font-size:10px;font-weight:600;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center}
.sb-user{margin-top:auto;padding:10px;border-top:1px solid rgba(255,255,255,.08)}
.user-card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;position:relative}
.user-card:hover{background:rgba(255,255,255,.06)}
.uavatar{width:32px;height:32px;border-radius:50%;background:var(--accent-600);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0}
.uinfo{flex:1;min-width:0}
.uname{font-size:12px;font-weight:500;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urole{font-size:11px;color:rgba(255,255,255,.42);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-menu{position:absolute;bottom:calc(100% + 4px);left:0;right:0;background:var(--primary-800);border:1px solid rgba(255,255,255,.12);border-radius:8px;overflow:hidden;z-index:100;display:none}
.user-menu.open{display:block}
.um-env{padding:7px 13px;font-size:10px;color:var(--accent-500);background:rgba(0,191,174,.07);border-bottom:1px solid rgba(255,255,255,.06)}
.um-item{padding:9px 13px;font-size:12.5px;color:rgba(255,255,255,.72);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05)}
.um-item:last-child{border-bottom:none}
.um-item:hover{background:rgba(255,255,255,.07);color:#fff}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:var(--topbar-h);min-height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border-light);display:flex;align-items:center;padding:0 24px;gap:12px;z-index:40}
.tb-title{font-size:15px;font-weight:600;color:var(--t900);flex:1}
.tb-sub{font-size:13px;font-weight:400;color:var(--t400);margin-left:5px}
.tb-actions{display:flex;align-items:center;gap:6px}
#content{flex:1;overflow:auto;padding:24px;min-width:0}
#content.no-pad{padding:0;overflow:hidden}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-md);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:background .12s,opacity .12s;white-space:nowrap;font-family:inherit;line-height:1}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent-600);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-500)}
.btn-secondary{background:var(--surface);color:var(--t900);border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--page)}
.btn-ghost{background:transparent;color:var(--t600);padding:8px 10px}
.btn-ghost:hover:not(:disabled){background:var(--page)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(168,58,50,.22)}
.btn-danger:hover:not(:disabled){background:#f5d4d1}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-icon{padding:7px;width:34px;height:34px;justify-content:center}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:var(--t900)}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
.kpi-card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:16px;position:relative;overflow:hidden}
.kpi-accent{position:absolute;top:0;right:0;width:4px;height:100%;background:var(--accent-600);opacity:.35}
.kpi-card.kpi-warn .kpi-accent{background:var(--warn)}
.kpi-card.kpi-danger .kpi-accent{background:var(--danger)}
.kpi-label{font-size:10px;font-weight:500;color:var(--t400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.kpi-val{font-size:28px;font-weight:700;color:var(--t900);line-height:1;margin-bottom:3px}
.kpi-sub{font-size:11px;color:var(--t400)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500;white-space:nowrap}
.b-tier{font-size:10px;font-weight:600;border-radius:4px;padding:2px 6px}
.b-t0{background:#F0F0F0;color:#666}.b-ts{background:var(--info-bg);color:var(--info)}.b-t1{background:var(--accent-100);color:var(--primary-700)}.b-t2{background:var(--warn-bg);color:var(--warn)}.b-t3{background:#F0F0F0;color:#666}.b-t4{background:var(--danger-bg);color:var(--danger)}.b-t5{background:#E8F8EC;color:#2A7A3E}.b-t6{background:#F5F5F5;color:#888}
.b-stage{background:var(--page);color:var(--t600);border:1px solid var(--border)}
.b-pending{background:var(--warn-bg);color:var(--warn)}
.b-approved{background:var(--accent-100);color:var(--primary-700)}
.b-rejected{background:var(--danger-bg);color:var(--danger)}
.b-new{background:var(--info-bg);color:var(--info)}

/* FORM */
input,select,textarea{font-family:inherit;font-size:13px;color:var(--t900);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px;background:var(--surface);outline:none;transition:border-color .12s}
input:focus,select:focus,textarea:focus{border-color:var(--accent-600);box-shadow:0 0 0 3px rgba(0,169,149,.1)}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--t600);margin-bottom:5px}

/* TABLES */
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;color:var(--t400);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border-light);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border-light);font-size:13px;color:var(--t900);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--accent-050)}

/* DRAWER */
#drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:200;display:none;backdrop-filter:blur(2px)}
#drawer-overlay.open{display:block}
#drawer{position:fixed;top:0;right:-620px;width:var(--drawer-w);height:100vh;background:var(--surface);z-index:201;display:flex;flex-direction:column;transition:right .28s cubic-bezier(.16,1,.3,1);box-shadow:-8px 0 40px rgba(0,0,0,.14)}
#drawer.open{right:0}
.dr-header{padding:20px 24px 16px;border-bottom:1px solid var(--border-light);display:flex;align-items:flex-start;gap:12px;flex-shrink:0}
.dr-title{flex:1;font-size:16px;font-weight:600;color:var(--t900)}
.dr-body{flex:1;overflow-y:auto;padding:20px 24px}
.dr-footer{padding:14px 24px;border-top:1px solid var(--border-light);display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:300;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#modal-overlay.open{display:flex}
#modal{background:var(--surface);border-radius:var(--r-lg);width:var(--modal-w);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.mo-header{padding:20px 24px 16px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:12px;flex-shrink:0}
.mo-title{flex:1;font-size:15px;font-weight:600}
.mo-body{flex:1;overflow-y:auto;padding:20px 24px}
.mo-footer{padding:14px 24px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}

/* TOAST */
#toast-container{position:fixed;top:16px;right:16px;z-index:400;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;box-shadow:0 4px 16px rgba(0,0,0,.1);font-size:13px;min-width:280px;max-width:380px;pointer-events:all;animation:toast-in .25s ease;display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.toast.success{border-left:3px solid var(--accent-600)}.toast.warn{border-left:3px solid var(--warn)}.toast.danger{border-left:3px solid var(--danger)}.toast.info{border-left:3px solid var(--info)}
@keyframes toast-in{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* PIPELINE BOARD */
.board-wrap{display:flex;height:calc(100vh - var(--topbar-h) - 49px);overflow-x:auto;gap:10px;padding:14px;background:var(--page)}
.board-col{min-width:230px;max-width:230px;display:flex;flex-direction:column;background:#EBF0ED;border-radius:var(--r-lg);overflow:hidden}
.board-col-hdr{padding:9px 11px;font-size:11px;font-weight:600;color:var(--t600);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.06)}
.board-col-count{font-size:10px;font-weight:600;color:var(--t400);background:rgba(0,0,0,.06);border-radius:8px;padding:1px 6px}
.board-col-body{flex:1;overflow-y:auto;padding:7px;display:flex;flex-direction:column;gap:5px;min-height:60px}
.board-col-body.drag-over{background:rgba(0,191,174,.08);outline:2px dashed var(--accent-600);outline-offset:-2px;border-radius:8px}
.deal-card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--r-md);padding:10px 11px;cursor:pointer;transition:box-shadow .12s,border-color .12s;position:relative;user-select:none}
.deal-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);border-color:var(--accent-600)}
.deal-card.dragging{opacity:.45}
.deal-card.proposed{border-color:var(--warn);background:#FFFCF5}
.dc-company{font-size:12px;font-weight:600;color:var(--t900);margin-bottom:2px}
.dc-project{font-size:11px;color:var(--t400);margin-bottom:7px;line-height:1.3}
.dc-meta{display:flex;align-items:center;justify-content:space-between}
.appr-banner{background:var(--warn-bg);border:1px solid rgba(183,107,0,.2);border-radius:5px;padding:5px 8px;font-size:11px;color:var(--warn);display:flex;align-items:center;gap:5px;margin-top:5px}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border-light);margin-bottom:20px;overflow-x:auto}
.tab{padding:9px 15px;font-size:13px;font-weight:500;color:var(--t400);cursor:pointer;border-bottom:2px solid transparent;transition:color .12s,border-color .12s;white-space:nowrap;flex-shrink:0}
.tab:hover{color:var(--t900)}
.tab.active{color:var(--accent-600);border-bottom-color:var(--accent-600)}

/* FEED */
.feed-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border-light);cursor:pointer;border-radius:var(--r-md);transition:background .1s}
.feed-item:last-child{border-bottom:none}
.feed-item:hover{background:var(--accent-050);margin:0 -12px;padding:11px 12px}
.feed-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.fi-email{background:var(--info-bg);color:var(--info)}.fi-approval{background:var(--accent-100);color:var(--accent-600)}.fi-outreach{background:#EEEEFF;color:#4A52C0}
.feed-content{flex:1;min-width:0}
.feed-title{font-size:13px;font-weight:500;color:var(--t900);margin-bottom:2px}
.feed-sub{font-size:12px;color:var(--t400);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-time{font-size:11px;color:var(--t200)}

/* NOTICES */
.notice{padding:9px 13px;border-radius:var(--r-md);font-size:12px;line-height:1.5;margin-bottom:12px}
.notice-info{background:var(--info-bg);color:var(--info);border-left:3px solid var(--info)}
.notice-warn{background:var(--warn-bg);color:var(--warn);border-left:3px solid var(--warn)}
.notice-danger{background:var(--danger-bg);color:var(--danger);border-left:3px solid var(--danger)}
.notice-demo{background:rgba(0,191,174,.07);color:var(--primary-700);border:1px solid rgba(0,191,174,.22)}

/* LAYOUT */
.two-col{display:grid;grid-template-columns:65fr 35fr;gap:16px;align-items:start}
.sticky-right{position:sticky;top:0}
.info-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-lbl{color:var(--t400);min-width:130px;flex-shrink:0;font-size:12px}
.info-val{color:var(--t900)}
.filters-bar{display:flex;align-items:center;gap:8px;padding:12px 0;flex-wrap:wrap}
.fpill{padding:5px 12px;border-radius:20px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:var(--surface);color:var(--t600);transition:all .12s;user-select:none}
.fpill.active{background:var(--accent-100);border-color:var(--accent-600);color:var(--primary-700);font-weight:500}
.srch{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:var(--r-md);padding:7px 11px;background:var(--surface);flex:1;max-width:280px}
.srch input{border:none;padding:0;box-shadow:none;flex:1;font-size:13px}
.srch input:focus{box-shadow:none}
.progress-bar{height:5px;background:var(--border-light);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent-600);border-radius:3px;transition:width .3s}
.avatar-sm{width:24px;height:24px;border-radius:50%;background:var(--accent-600);display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#fff;border:2px solid var(--surface)}
.section-label{font-size:11px;font-weight:500;color:var(--t400);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.divider{height:1px;background:var(--border-light);margin:14px 0}
.upload-area{border:2px dashed var(--border);border-radius:var(--r-lg);padding:28px;text-align:center;color:var(--t400);background:var(--page);cursor:pointer;transition:border-color .12s}
.upload-area:hover{border-color:var(--accent-600)}
.upload-notice{font-size:11px;color:var(--warn);background:var(--warn-bg);padding:5px 9px;border-radius:var(--r-sm);margin-top:8px;display:inline-block}

/* CRITERIA */
.crit-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid var(--border-light)}
.crit-row:last-child{border-bottom:none}
.crit-name{font-size:12px;color:var(--t600);min-width:150px}
.crit-bar{flex:1;height:4px;background:var(--border-light);border-radius:2px;margin:0 11px}
.crit-fill{height:100%;border-radius:2px;background:var(--accent-600)}
.crit-fill.med{background:var(--warn)}.crit-fill.low{background:var(--danger)}
.crit-pct{font-size:11px;font-weight:500;min-width:36px;text-align:right}
.ch{color:#2A7A3E;background:#E8F8EC;padding:2px 6px;border-radius:10px;font-size:10px}
.cm{color:var(--warn);background:var(--warn-bg);padding:2px 6px;border-radius:10px;font-size:10px}
.cl{color:var(--danger);background:var(--danger-bg);padding:2px 6px;border-radius:10px;font-size:10px}

/* SF TABLE */
.sf-table{width:100%;border-collapse:collapse;font-size:12px}
.sf-table th{background:var(--page);padding:6px 10px;font-weight:500;color:var(--t400);text-align:left;border-bottom:1px solid var(--border-light)}
.sf-table td{padding:7px 10px;border-bottom:1px solid var(--border-light)}
.sf-table tr:last-child td{border-bottom:none}
.sf-changed{color:var(--warn);font-weight:500}

/* WORKSPACE */
#workspace-overlay{position:fixed;inset:0;background:var(--page);z-index:150;display:none;flex-direction:column}
#workspace-overlay.open{display:flex}
.ws-header{background:var(--surface);border-bottom:1px solid var(--border-light);padding:0 24px;flex-shrink:0}
.ws-toprow{display:flex;align-items:center;gap:12px;height:56px}
.ws-company{font-size:16px;font-weight:700;color:var(--t900)}
.ws-metarow{display:flex;align-items:center;gap:14px;padding:8px 0;flex-wrap:wrap;border-top:1px solid var(--border-light)}
.ws-meta{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--t400)}
.ws-meta strong{color:var(--t900);font-weight:500}
.ws-tabs{display:flex;gap:0}
.ws-body{flex:1;overflow:auto;padding:24px}

/* MEMBER CARD */
.member-card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--r-md);padding:11px 15px;margin-bottom:6px;display:flex;align-items:center;gap:12px}

/* EMPTY / STUB */
.empty-state{text-align:center;padding:36px 20px;color:var(--t400)}
.empty-icon{font-size:30px;margin-bottom:10px}
.empty-title{font-size:14px;font-weight:600;color:var(--t600);margin-bottom:5px}
.empty-sub{font-size:13px}
.stub-page{display:flex;flex-direction:column;align-items:center;justify-content:center;height:50vh;color:var(--t400);text-align:center}
.stub-icon{font-size:38px;margin-bottom:14px;opacity:.45}
.stub-title{font-size:17px;font-weight:600;color:var(--t600);margin-bottom:6px}
.stub-sub{font-size:13px;max-width:380px;line-height:1.55}

/* PIPE TOOLBAR */
.pipe-toolbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border-light);flex-shrink:0}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--t200)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container"></div>

<script>
// ============================================================
// SYNTHETIC DATA
// ============================================================
const USERS = {
  leadPartner:{id:'leadPartner',name:'A. Helmund',role:'Lead Partner',initials:'AH'},

async function callClaude(userPrompt, systemPrompt='You are a professional investment analyst assistant.'){
  if(!STATE.apiKey) return {success:false, error:'No API key configured'};
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':STATE.apiKey,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1500,system:systemPrompt,messages:[{role:'user',content:userPrompt}]})
    });
    if(!resp.ok){const e=await resp.json();return{success:false,error:e.error?.message||'API error '+resp.status}}
    const data=await resp.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'';
    return {success:true,text};
  } catch(e){
    return {success:false,error:e.message};
  }
}

async function generateOnePager(oppId){
  const opp=OPPORTUNITIES.find(o=>o.id===oppId);
  if(!opp)return;
  const adv=ADVISERS[opp.adviser];

  if(b) b.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:16px;color:var(--t400)"><div style="width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent-600);border-radius:50%;animation:spin .8s linear infinite"></div><div style="font-size:13px">Generating one-pager with Claude…</div></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;

  let result;
  if(STATE.apiKey){
    const prompt=`Write a concise investment one-pager for the following opportunity. Use professional investment language. Structure it with clear sections: Executive Summary, Investment Highlights, Market Opportunity, Deal Terms, ESG & Impact, and Risks.

Company: ${opp.company}
Project: ${opp.project}
Sector: ${opp.sector}
Geography: ${opp.geography}
Transaction Type: ${opp.txType}
Equity Ask: ${opp.ask}
Stage: ${opp.stage}
Investment Context: ${opp.sweetSpot}
Prior Decision: ${opp.priorDecision||'First assessment'}
Adviser: ${adv?.name||'Direct'}

Keep it to 400–500 words. Use bullet points for highlights and risks. Write in third person.`;
    result=await callClaude(prompt,'You are a senior investment analyst at a sustainable infrastructure fund. Write concise, professional investment documents.');
  } else {
    await delay(1200);
    result={success:true, text:`**${opp.company} – Investment One-Pager**\n\n**Executive Summary**\n${opp.company} is a ${opp.sector.toLowerCase()} business based in ${opp.geography}, seeking ${opp.ask} in ${opp.txType.toLowerCase()}. The company ${opp.sweetSpot.toLowerCase()}\n\n**Investment Highlights**\n• Strong sector alignment with sustainable infrastructure mandate\n• ${opp.geography} market with favourable regulatory backdrop\n• Transaction type: ${opp.txType} at ${opp.ask}\n• Stage: ${opp.stage}\n\n**Market Opportunity**\nThe ${opp.sector} sector benefits from structural growth drivers including policy support and increasing investor demand for sustainable assets.\n\n**Deal Terms**\nEquity ask of ${opp.ask} at ${opp.stage}. Adviser: ${adv?.name||'Direct'}. Transaction type: ${opp.txType}.\n\n**ESG & Impact**\nThe investment aligns with the fund's impact objectives across environmental stewardship and infrastructure resilience.\n\n**Key Risks**\n• Execution risk at current stage\n• Regulatory and market timing uncertainty\n• Information gaps noted: see due diligence checklist\n\n*Generated in demo mode. Configure an Anthropic API key in Connections and Access to generate with live AI.*`};
  }

  STATE.aiGenerating=false;
  if(b){
    if(result.success){
      // Store generated text on opp
      opp._onepager=result.text;
      b.innerHTML=wsDoc(opp,'One-pager','onepager');
    } else {
      b.innerHTML=`<div class="notice notice-danger">${icon('alert',14)} Generation failed: ${result.error}</div><div style="margin-top:12px">${wsDoc(opp,'One-pager','onepager')}</div>`;
    }
  }
}

const NAV=[
  {group:'DAILY WORK',items:[{id:'dashboard',label:'Dashboard',icon:'dash'},{id:'approvals',label:'Approvals',icon:'check',badge:()=>APPROVALS.filter(a=>a.status==='pending').length}]},
  {group:'DEALFLOW',items:[{id:'incoming-deals',label:'Incoming Deals',icon:'mail',badge:()=>EMAILS.filter(e=>e.status==='pending').length},{id:'pipeline',label:'Pipeline',icon:'pipeline'},{id:'newsletter',label:'Newsletter',icon:'newspaper'}]},
  {group:'KNOWLEDGE',items:[{id:'decision-memory',label:'Decision Memory',icon:'brain'},{id:'research',label:'Research',icon:'research'},{id:'adviser-coverage',label:'Adviser Coverage',icon:'coverage'}]},
  {group:'RELATIONSHIPS',items:[{id:'outreach-campaigns',label:'Outreach Campaigns',icon:'mail2'},{id:'fundraising',label:'Fundraising Intelligence',icon:'trending'}]},
  {group:'PORTFOLIO',items:[{id:'portfolio',label:'Portfolio Value Creation',icon:'portfolio'}]},
  {group:'REPORTING',items:[{id:'lp-reporting',label:'LP Reporting',icon:'fund'},{id:'coverage-dashboard',label:'Coverage Dashboard',icon:'chart'}]},
  {group:'GOVERNANCE',items:[{id:'workflow-controls',label:'Workflow Controls',icon:'workflow'},{id:'operating-guardrails',label:'Operating Guardrails',icon:'shield'},{id:'activity-log',label:'Agent Activity Log',icon:'log'},{id:'connections',label:'Connections and Access',icon:'key'}]}
];

function renderSidebar(){
  const u=USERS[STATE.currentUser];
  let nav='';
  for(const g of NAV){
    nav+=`<div class="nav-section"><div class="nav-label">${g.group}</div>`;
    for(const it of g.items){
      const bc=it.badge?it.badge():0;
      nav+=`<div class="nav-item${STATE.currentPage===it.id?' active':''}" onclick="navigate('${it.id}')"><span class="nav-icon">${icon(it.icon,15)}</span><span>${it.label}</span>${bc>0?`<span class="nav-badge">${bc}</span>`:''}</div>`;
    }
    nav+='</div>';
  }
  return`<div id="sidebar"><div class="sb-header"><div class="sb-logo"><div class="sb-mark">N</div><div class="sb-name">Northstar<br>Investment Intelligence</div></div><div class="demo-badge">DEMO ENVIRONMENT · SYNTHETIC DATA</div></div>${nav}<div class="sb-user"><div class="user-card" onclick="toggleMenu(event)"><div class="uavatar">${u.initials}</div><div class="uinfo"><div class="uname">Demo Analyst</div><div class="urole">Investment Team</div></div></div><div class="user-menu" id="user-menu"><div class="um-env">Demo environment · Synthetic data</div><div class="um-item" onclick="navigate('dashboard');toggleMenu(event)">Dashboard</div><div class="um-item" onclick="doReset()">Reset demo</div><div class="um-item" onclick="doClear()">Clear session</div><div class="um-item">Sign out</div></div></div></div>`;
}

function renderTopbar(title){
  const p=APPROVALS.filter(a=>a.status==='pending').length;
  return`<div id="topbar"><div class="tb-title">${title}</div><div class="tb-actions"><button class="btn btn-ghost btn-icon" title="Notifications" style="position:relative">${icon('bell',18)}${p>0?'<span style="position:absolute;top:7px;right:7px;width:7px;height:7px;background:var(--danger);border-radius:50%;border:2px solid white"></span>':''}</button><button class="btn btn-ghost btn-icon" onclick="renderApp()" title="Refresh">${icon('refresh',18)}</button></div></div>`;
}

// ============================================================
// ROUTER
// ============================================================
function navigate(pg){STATE.currentPage=pg;closeDrawer();closeModal();if(STATE.workspaceOpen)closeWorkspace();renderApp()}

function pageContent(){
  switch(STATE.currentPage){
    case'dashboard':return['Dashboard',pageDashboard(),false];
    case'approvals':return['Approvals',pageApprovals(),false];
    case'incoming-deals':return['Incoming Deals',pageIncomingDeals(),false];
    case'pipeline':return['Pipeline',pagePipeline(),true];
    case'newsletter':return['Newsletter',pageStub('newspaper','Newsletter','Curated market intelligence and deal news, compiled from your tracked sectors and geographies.'),false];
    case'decision-memory':return['Decision Memory',pageDecisionMemory(),false];
    case'research':return['Research',pageStub('research','Research','Integrated research tools for sector analysis, market sizing, and competitive benchmarking.'),false];
    case'adviser-coverage':return['Adviser Coverage',pageAdviserCoverage(),false];
    case'outreach-campaigns':return['Outreach Campaigns',pageOutreach(),false];
    case'fundraising':return['Fundraising Intelligence',pageStub('trending','Fundraising Intelligence','LP pipeline management, commitment tracking, and fundraising analytics.'),false];
    case'portfolio':return['Portfolio Value Creation',pageStub('portfolio','Portfolio Value Creation','Portfolio company performance monitoring, KPI tracking, and value creation initiatives.'),false];
    case'lp-reporting':return['LP Reporting',pageLPReporting(),false];
    case'coverage-dashboard':return['Coverage Dashboard',pageStub('chart','Coverage Dashboard','Sector and geography coverage analytics, deal flow summary, and team activity metrics.'),false];
    case'workflow-controls':return['Workflow Controls',pageWorkflowControls(),false];
    case'operating-guardrails':return['Operating Guardrails',pageOperatingGuardrails(),false];
    case'activity-log':return['Agent Activity Log',pageActivityLog(),false];
    case'connections':return['Connections and Access',pageConnections(),false];
    default:return['Dashboard',pageDashboard(),false];
  }
}

function renderApp(){
  const[title,content,noPad]=pageContent();
  document.getElementById('app').innerHTML=
    renderSidebar()+
    `<div id="main">${renderTopbar(title)}<div id="content"${noPad?' class="no-pad"':''}>${content}</div></div>`+
    `<div id="drawer-overlay"${STATE.drawerOpen?' class="open"':''} onclick="closeDrawer()"></div>`+
    `<div id="drawer"${STATE.drawerOpen?' class="open"':''}>${STATE.drawerOpen?STATE.drawerContent:''}</div>`+
    `<div id="modal-overlay"${STATE.modalOpen?' class="open"':''} onclick="closeModal()"><div id="modal" onclick="event.stopPropagation()">${STATE.modalOpen?STATE.modalContent:''}</div></div>`+
    `<div id="workspace-overlay"${STATE.workspaceOpen?' class="open"':''}>${STATE.workspaceOpen?renderWorkspace():''}</div>`;
  if(STATE.currentPage==='pipeline'&&STATE.pipelineView==='board')bindDrag();
}

function pageDashboard(){
  const active=OPPORTUNITIES.filter(o=>['1','2'].includes(o.tier)).length;
  const pAppr=APPROVALS.filter(a=>a.status==='pending').length;
  const pEmail=EMAILS.filter(e=>e.status==='pending').length;
  const totalLP=LPS.reduce((s,l)=>s+l.commitment,0);
  const stale=OPPORTUNITIES.filter(o=>o.stale).length;
  const cmp=new Set(CAMPAIGN_MEMBERS.map(m=>m.campaign)).size;

  const kpis=[
    {lbl:'Active Deals',val:active,sub:'Tiers 1 & 2',cls:''},
    {lbl:'Pending Approvals',val:pAppr,sub:'Awaiting decision',cls:pAppr>0?'kpi-warn':''},
    {lbl:'Incoming Emails',val:pEmail,sub:'Pending review',cls:pEmail>0?'kpi-warn':''},
    {lbl:'LP Commitments',val:`€${totalLP}m`,sub:`${LPS.length} limited partners`,cls:''},
    {lbl:'Stale Deals',val:stale,sub:'No activity >30 days',cls:stale>0?'kpi-danger':''},
    {lbl:'Active Campaigns',val:cmp,sub:'Outreach in progress',cls:''}
  ];

  const feedItems=[
    ...EMAILS.map(e=>({time:e.received,title:`New email: ${e.company}`,sub:`${e.sender} · ${e.subject.substring(0,50)}…`,iCls:'fi-email',action:`openEmailReview('${e.id}')`})),
    ...APPROVALS.filter(a=>a.status==='pending').map(a=>({time:a.created,title:`Approval: ${a.company}`,sub:a.decision,iCls:'fi-approval',action:`openApprovalDrawer('${a.id}')`}))
  ].sort((a,b)=>new Date(b.time)-new Date(a.time)).slice(0,6);

  const myWork=OPPORTUNITIES.filter(o=>o.reviewer===STATE.currentUser&&['1','2'].includes(o.tier));
  const staleOpps=OPPORTUNITIES.filter(o=>o.stale);
  const pendAppOpps=OPPORTUNITIES.filter(o=>o.approvalState==='pending');
  const outUpdates=CAMPAIGN_MEMBERS.filter(m=>m.sfPending);

  return`
<div class="kpi-grid">${kpis.map(k=>`<div class="kpi-card ${k.cls}"><div class="kpi-accent"></div><div class="kpi-label">${k.lbl}</div><div class="kpi-val">${k.val}</div><div class="kpi-sub">${k.sub}</div></div>`).join('')}</div>
<div class="two-col">
<div>
<div class="card" style="margin-bottom:16px"><div class="card-header"><div class="card-title">${icon('mail',14)} Incoming Deal Activity</div><button class="btn btn-secondary btn-sm" onclick="navigate('incoming-deals')">View all</button></div><div class="notice notice-info" style="font-size:11px">Deal-relevant summary only. The source mailbox remains unchanged.</div>${feedItems.map(f=>`<div class="feed-item" onclick="${f.action}"><div class="feed-icon ${f.iCls}">${icon('mail',13)}</div><div class="feed-content"><div class="feed-title">${f.title}</div><div class="feed-sub">${f.sub}</div><div class="feed-time">${formatTime(f.time)}</div></div></div>`).join('')||'<div class="empty-state"><div class="empty-sub">No recent activity</div></div>'}</div>

${myWork.length?`<div class="card" style="margin-bottom:16px"><div class="card-header"><div class="card-title">My Active Work</div></div>${myWork.map(o=>`<div class="feed-item" onclick="openWorkspace('${o.id}')"><div style="flex:1"><div style="display:flex;align-items:center;gap:7px;margin-bottom:3px"><span style="font-size:13px;font-weight:600">${o.company}</span>${tierBadge(o.tier)}${o.approvalState==='pending'?'<span class="badge b-pending">Approval pending</span>':''}</div><div style="font-size:12px;color:var(--t400)">${o.stage} · ${o.geography}</div></div><div style="text-align:right"><div class="progress-bar" style="width:72px;margin-bottom:3px"><div class="progress-fill" style="width:${o.completeness}%"></div></div><div style="font-size:11px;color:var(--t400)">${o.completeness}%</div></div></div>`).join('')}</div>`:''}

${staleOpps.length||pendAppOpps.length?`<div class="card" style="margin-bottom:16px"><div class="card-header"><div class="card-title">${icon('alert',14)} Pipeline Alerts</div></div>${staleOpps.map(o=>`<div class="notice notice-warn" style="cursor:pointer;margin-bottom:6px" onclick="openWorkspace('${o.id}')"><strong>${o.company}</strong> — No activity in 30+ days. Stage: ${o.stage}.</div>`).join('')}${pendAppOpps.map(o=>`<div class="appr-banner" style="margin-bottom:6px;cursor:pointer" onclick="navigate('approvals')">${icon('alert',13)} <strong>${o.company}</strong> — approval request pending.</div>`).join('')}</div>`:''}

${outUpdates.length?`<div class="card" style="margin-bottom:16px"><div class="card-header"><div class="card-title">Outreach Updates</div><span style="font-size:11px;color:var(--t400)">Campaign status auto-updated</span></div>${outUpdates.map(m=>`<div class="feed-item" onclick="navigate('outreach-campaigns')"><div class="feed-icon fi-outreach">${icon('mail2',13)}</div><div class="feed-content"><div class="feed-title">${m.contact} / ${m.company}</div><div class="feed-sub">${m.responseType} · Salesforce update pending approval</div></div></div>`).join('')}</div>`:''}
</div>
<div class="sticky-right">
<div class="card" style="margin-bottom:14px"><div class="card-header"><div class="card-title">Actions and Approvals</div><span class="badge b-pending">${pAppr} pending</span></div>${APPROVALS.filter(a=>a.status==='pending').map(a=>`<div style="padding:11px;border:1px solid var(--border-light);border-radius:var(--r-md);margin-bottom:8px;cursor:pointer" onclick="openApprovalDrawer('${a.id}')"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px"><div style="font-size:13px;font-weight:600">${a.company}</div><span class="badge b-pending">Pending</span></div><div style="font-size:12px;color:var(--t400);margin-bottom:8px">${a.decision}</div><div style="display:flex;gap:6px"><button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openApprovalDrawer('${a.id}')">Review</button></div></div>`).join('')||'<div class="empty-state"><div class="empty-icon">✓</div><div class="empty-sub">No pending approvals</div></div>'}</div>
<div class="card"><div class="card-header"><div class="card-title">Recent Automated Preparation</div></div>${ACTIVITY_LOG.slice(0,3).map(e=>`<div style="padding:8px 0;border-bottom:1px solid var(--border-light);font-size:12px"><div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="font-weight:500">${e.company}</span><span style="color:var(--t400)">${formatTime(e.timestamp)}</span></div><div style="color:var(--t400)">${e.workflow}</div><div style="color:var(--t600);margin-top:1px">${e.preparation.substring(0,75)}…</div></div>`).join('')}</div>
</div>
</div>`;
}

function pageIncomingDeals(){

// ============================================================
function bindDrag(){
  document.querySelectorAll('.deal-card[draggable="true"]').forEach(c=>{
    c.addEventListener('dragstart',e=>{STATE.draggingOpp=c.dataset.opp;c.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
    c.addEventListener('dragend',()=>{c.classList.remove('dragging');STATE.draggingOpp=null});
  });
}
function dOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over')}
function dLeave(e){e.currentTarget.classList.remove('drag-over')}
function dDrop(e){
  e.preventDefault();const col=e.currentTarget;col.classList.remove('drag-over');
  if(!STATE.draggingOpp)return;
  const targetTier=col.dataset.tier;const restricted=col.dataset.restricted==='true';
  const opp=OPPORTUNITIES.find(o=>o.id===STATE.draggingOpp);
  if(!opp||opp.tier===targetTier)return;
  if(restricted){showModal('Restricted move',`<p style="font-size:13px;color:var(--t600)">Moving a deal to <strong>${TIER_LABELS[targetTier]}</strong> requires a formal decision workflow.</p><p style="font-size:13px;color:var(--t400);margin-top:8px">Submit an approval request to proceed.</p>`,[{lbl:'Go to Approvals',cls:'btn-primary',fn:"navigate('approvals');closeModal()"},{lbl:'Cancel',cls:'btn-secondary',fn:'closeModal()'}]);return}
  showModal('Confirm tier change',`<div style="margin-bottom:14px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="font-size:15px;font-weight:700">${opp.company}</span></div><div style="display:flex;align-items:center;gap:8px;font-size:13px"><span class="badge b-tier b-t${opp.tier.toLowerCase()}">${TIER_LABELS[opp.tier]}</span>${icon('arrow',15)}<span class="badge b-tier b-t${targetTier.toLowerCase()}" style="background:var(--warn-bg);color:var(--warn)">${TIER_LABELS[targetTier]}</span></div></div><div class="form-group"><div class="form-label">Reason for change (required)</div><textarea id="tc-reason" style="width:100%;min-height:68px" placeholder="Describe the rationale…"></textarea></div><div class="notice notice-warn" style="font-size:12px">This creates an approval request. The card stays in its current column until approved.</div>`,[{lbl:'Propose change',cls:'btn-primary',fn:`proposeTier('${opp.id}','${targetTier}')`},{lbl:'Cancel',cls:'btn-secondary',fn:'closeModal()'}]);
}

async function proposeTier(oppId,targetTier){
  const reason=document.getElementById('tc-reason')?.value;
  if(!reason||!reason.trim()){toast('Please provide a reason for the tier change.','warn');return}
  const opp=OPPORTUNITIES.find(o=>o.id===oppId);
  if(!opp)return;
  opp._proposed={targetTier,reason};opp.approvalState='pending';
  APPROVALS.unshift({id:'APR0'+String(APPROVALS.length+1).padStart(2,'0'),type:'tier-change',company:opp.company,opp:oppId,decision:`Tier change: T${opp.tier} → T${targetTier}`,currentValue:`Tier ${opp.tier} – ${TIER_LABELS[opp.tier]}`,proposedValue:`Tier ${targetTier} – ${TIER_LABELS[targetTier]}`,reason,trigger:'Manual – '+(USERS[STATE.currentUser]?.name||'Demo Analyst'),sources:['Pipeline board – drag action'],missingInfo:[],reviewer:STATE.currentUser,approver:'leadPartner',status:'pending',created:new Date().toISOString(),sfComparison:[{field:'Tier',current:`Tier ${opp.tier}`,proposed:`Tier ${targetTier}`,changed:true},{field:'Stage',current:opp.stage,proposed:opp.stage,changed:false}]});
  logEvent({workflow:'Pipeline Management',objectType:'Opportunity',recordId:oppId,company:opp.company,project:opp.project,trigger:'Manual tier change request',source:'Pipeline board',inputSummary:`Tier change T${opp.tier}→T${targetTier}. Reason: ${reason}`,preparation:'Approval request generated.',decision:'Pending approval',approver:'leadPartner',previousValue:`Tier ${opp.tier}`,proposedValue:`Tier ${targetTier}`,finalValue:null,executionResult:'Awaiting approval'});
  closeModal();toast(`Tier change proposed for ${opp.company}. Card stays in current column until approved.`,'warn');renderApp();
}

function renderWorkspace(){
  const opp=OPPORTUNITIES.find(o=>o.id===STATE.workspaceOpp);

  const tabs=[['overview','Overview'],['nda','NDA'],['onepager','One-pager'],['tir','TIR'],['icmemo','IC Memo'],['actions','Actions'],['history','History']];
  const pct=opp.completeness;const pCol=pct>=70?'var(--accent-600)':pct>=40?'var(--warn)':'var(--danger)';
  let body='';
  const t=STATE.workspaceTab;
  if(t==='overview')body=wsOverview(opp);
  else if(t==='nda')body=wsNDA(opp);
  else if(t==='onepager')body=wsDoc(opp,'One-pager','onepager');
  else if(t==='tir')body=wsTIR(opp);
  else if(t==='icmemo')body=wsICMemo(opp);
  else if(t==='actions')body=wsActions(opp);
  else if(t==='history')body=wsHistory(opp);

}

function wsTab(tab){STATE.workspaceTab=tab;const b=document.getElementById('ws-body');const opp=OPPORTUNITIES.find(o=>o.id===STATE.workspaceOpp);if(!b||!opp)return;let c='';if(tab==='overview')c=wsOverview(opp);else if(tab==='nda')c=wsNDA(opp);else if(tab==='onepager')c=wsDoc(opp,'One-pager','onepager');else if(tab==='tir')c=wsTIR(opp);else if(tab==='icmemo')c=wsICMemo(opp);else if(tab==='actions')c=wsActions(opp);else if(tab==='history')c=wsHistory(opp);b.innerHTML=c;document.querySelectorAll('.ws-tabs .tab').forEach(el=>{el.classList.toggle('active',el.onclick?.toString().includes(`'${tab}'`))})}

  }

${isOnePager?`<button class="btn btn-primary btn-sm" onclick="generateOnePager('${opp.id}')" id="gen-btn">${icon('brain',13)} Generate with ${apiConfigured?'Claude API':'AI (demo)'}</button>`:''}

function openApprovalDrawer(aprId,oppId){
  if(aprId){
    const apr=APPROVALS.find(a=>a.id===aprId);if(!apr)return;
    STATE.drawerOpen=true;
    STATE.drawerContent=aprDrawer(apr);
  } else {
    const opp=OPPORTUNITIES.find(o=>o.id===oppId);if(!opp)return;
    STATE.drawerOpen=true;
    STATE.drawerContent=newAprDrawer(opp);
  }
  renderApp();
}

function aprDrawer(apr){
  return`<div class="dr-header"><div><div class="dr-title">${apr.decision}</div><div style="font-size:12px;color:var(--t400);margin-top:3px">${apr.company} · ${apr.id}</div></div><button class="btn btn-ghost btn-icon" onclick="closeDrawer()">${icon('x',17)}</button></div>
<div class="dr-body">
<div class="notice notice-info" style="margin-bottom:14px;font-size:12px">${icon('alert',13)} Triggered by: ${apr.trigger}</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px"><div class="card" style="padding:11px"><div class="section-label">Current value</div><div style="font-size:13px;font-weight:500">${apr.currentValue}</div></div><div class="card" style="padding:11px;border-color:var(--warn)"><div class="section-label">Proposed value</div><div style="font-size:13px;font-weight:500;color:var(--warn)">${apr.proposedValue}</div></div></div>
<div class="form-group"><div class="form-label">Reason</div><div style="font-size:13px;color:var(--t600);background:var(--page);padding:10px 11px;border-radius:var(--r-md)">${apr.reason}</div></div>
${apr.missingInfo.length?`<div class="notice notice-warn" style="margin-bottom:14px"><strong>Incomplete information:</strong> ${apr.missingInfo.join(' · ')}</div>`:''}
<div class="form-group"><div class="form-label">Sources</div>${apr.sources.map(s=>`<div style="font-size:12px;color:var(--t600);padding:4px 0;border-bottom:1px solid var(--border-light)">${s}</div>`).join('')}</div>
<div class="form-group"><div class="form-label">Prepared by / Approver</div><div style="display:flex;gap:14px;font-size:13px"><div><span style="color:var(--t400)">Reviewer:</span> ${uname(apr.reviewer)}</div><div><span style="color:var(--t400)">Approver:</span> ${uname(apr.approver)}</div></div></div>
<div class="section-label" style="margin-bottom:7px">Salesforce field comparison</div>
<table class="sf-table" style="margin-bottom:14px"><thead><tr><th>Field</th><th>Current</th><th>Proposed</th></tr></thead><tbody>${apr.sfComparison.map(r=>`<tr><td>${r.field}</td><td>${r.current}</td><td class="${r.changed?'sf-changed':''}">${r.proposed}</td></tr>`).join('')}</tbody></table>
<div class="form-group"><div class="form-label">Decision notes (optional)</div><textarea id="anotes-${apr.id}" style="width:100%;min-height:65px;resize:vertical" placeholder="Add conditions or notes…"></textarea></div>
</div>
<div class="dr-footer"><button class="btn btn-primary" id="appr-btn-${apr.id}" onclick="execApproval('${apr.id}','approve')">${icon('check',13)} Approve and execute</button><button class="btn btn-secondary" onclick="execApproval('${apr.id}','changes')">Request changes</button><button class="btn btn-danger" onclick="execApproval('${apr.id}','reject')">${icon('x',13)} Reject</button><button class="btn btn-ghost" onclick="closeDrawer()" style="margin-left:auto">Cancel</button></div>`;
}

function newAprDrawer(opp){
  return`<div class="dr-header"><div><div class="dr-title">Request approval</div><div style="font-size:12px;color:var(--t400);margin-top:3px">${opp.company} · ${opp.id}</div></div><button class="btn btn-ghost btn-icon" onclick="closeDrawer()">${icon('x',17)}</button></div>
<div class="dr-body">
<div class="form-group"><div class="form-label">Decision type</div><select style="width:100%"><option>Tier change</option><option>Stage progression</option><option>IC Memo submission</option><option>Other</option></select></div>
<div class="form-group"><div class="form-label">Reason</div><textarea style="width:100%;min-height:80px" placeholder="Describe the rationale…"></textarea></div>
<div class="form-group"><div class="form-label">Approver</div><select style="width:100%">${Object.values(USERS).map(u=>`<option value="${u.id}">${u.name} – ${u.role}</option>`).join('')}</select></div>
</div>
<div class="dr-footer"><button class="btn btn-primary" onclick="toast('Approval request submitted.','success');closeDrawer()">Submit for approval</button><button class="btn btn-ghost" onclick="closeDrawer()">Cancel</button></div>`;
}

async function execApproval(aprId,action){
  const apr=APPROVALS.find(a=>a.id===aprId);if(!apr)return;
  if(action==='approve'){
    const btn=document.getElementById(`appr-btn-${aprId}`);
    if(btn){btn.disabled=true;btn.textContent='Validating…'}
    try{
      await mockSalesforceAdapter.readRecord(apr.opp);
      const v=await mockSalesforceAdapter.validateUpdate(apr.id);
      if(v.hasConflict){toast('Update not applied. The record has changed since this proposal was prepared. Review the latest values and resubmit.','danger');closeDrawer();return}
      const fields={};apr.sfComparison.filter(r=>r.changed).forEach(r=>{fields[r.field]=r.proposed});
      const ex=await mockSalesforceAdapter.executeApprovedUpdate(apr.opp,fields);
      if(!ex.success){toast('Execution failed. Please try again.','danger');return}
      apr.status='approved';
      const opp=OPPORTUNITIES.find(o=>o.id===apr.opp);
      if(opp){if(apr.type==='tier-change')opp.tier=apr.sfComparison.find(r=>r.field==='Tier')?.proposed?.replace('Tier ','').trim()||opp.tier;opp.approvalState='approved';opp._proposed=null}
      logEvent({workflow:'Approval',objectType:'Approval Decision',recordId:apr.id,company:apr.company,project:'',trigger:'Manual approval',source:'Approvals drawer',inputSummary:apr.decision,preparation:'Record re-validated; no conflicts detected.',decision:'Approved',approver:STATE.currentUser,previousValue:apr.currentValue,proposedValue:apr.proposedValue,finalValue:apr.proposedValue,executionResult:'Executed successfully'});
      toast(`Approved and executed: ${apr.decision}`,'success');closeDrawer();renderApp();
    }catch(err){toast('An error occurred. Please try again.','danger');closeDrawer()}
  } else if(action==='reject'){
    apr.status='rejected';
    logEvent({workflow:'Approval',objectType:'Approval Decision',recordId:apr.id,company:apr.company,project:'',trigger:'Manual rejection',source:'Approvals drawer',inputSummary:apr.decision,preparation:'—',decision:'Rejected',approver:STATE.currentUser,previousValue:apr.currentValue,proposedValue:apr.proposedValue,finalValue:apr.currentValue,executionResult:'Not executed – rejected'});
    toast(`Approval rejected: ${apr.company}`,'warn');closeDrawer();renderApp();
  } else if(action==='changes'){
    toast('Changes requested. The preparer will be notified.','info');closeDrawer();
  }
}

// EMAIL REVIEW DRAWER
// ============================================================
function openEmailReview(emailId){
  const em=EMAILS.find(e=>e.id===emailId);if(!em)return;
  const adv=ADVISERS[em.adviser];
  const av=Math.round(em.screening.reduce((s,c)=>s+c.pct,0)/em.screening.length);
  STATE.drawerOpen=true;
  STATE.drawerContent=`<div class="dr-header"><div><div class="dr-title">${em.company} – Incoming Email</div><div style="font-size:12px;color:var(--t400);margin-top:3px">${em.id} · ${formatTime(em.received)}</div></div><button class="btn btn-ghost btn-icon" onclick="closeDrawer()">${icon('x',17)}</button></div>
<div class="dr-body">
<div class="notice notice-info" style="margin-bottom:14px;font-size:12px">Deal-relevant summary only. The source mailbox remains unchanged.</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px">
<div><div class="info-row"><div class="info-lbl">From</div><div class="info-val">${em.sender}</div></div><div class="info-row"><div class="info-lbl">Adviser</div><div class="info-val">${adv?.name||'Unknown'}</div></div><div class="info-row"><div class="info-lbl">Subject</div><div class="info-val" style="font-size:11px">${em.subject}</div></div></div>
<div><div class="info-row"><div class="info-lbl">Geography</div><div class="info-val">${em.geography}</div></div><div class="info-row"><div class="info-lbl">Sector</div><div class="info-val">${em.sector}</div></div><div class="info-row"><div class="info-lbl">Ask</div><div class="info-val">${em.ask}</div></div></div>
</div>
${em.priorDecisionMatch?`<div class="notice notice-info" style="margin-bottom:11px">Prior decision: <strong>${em.priorDecisionMatch}</strong></div>`:''}
<div class="section-label" style="margin-bottom:7px">Preliminary screening (avg. ${av}%)</div>
${em.screening.map(c=>`<div class="crit-row"><div class="crit-name">${c.name}</div><div class="crit-bar"><div class="crit-fill${fillCls(c.pct)}" style="width:${c.pct}%"></div></div><div class="crit-pct"><span class="${confCls(c.pct)}">${c.pct}%</span></div></div>`).join('')}
${em.missingInfo.length?`<div class="notice notice-warn" style="margin-top:11px"><strong>Missing:</strong> ${em.missingInfo.join(' · ')}</div>`:''}
<div style="height:1px;background:var(--border-light);margin:14px 0"></div>
<div class="section-label" style="margin-bottom:7px">Recommended action</div>
<div style="font-size:13px;color:var(--t600);margin-bottom:13px">${em.recommendedAction}</div>
<div class="form-group"><div class="form-label">Assign reviewer</div><select style="width:100%"><option value="">Unassigned</option>${Object.values(USERS).map(u=>`<option value="${u.id}"${em.assignedReviewer===u.id?' selected':''}>${u.name} – ${u.role}</option>`).join('')}</select></div>
</div>
<div class="dr-footer">${em.type==='new'?`<button class="btn btn-primary" onclick="createDeal('${em.id}')">${icon('plus',13)} Create deal record</button>`:`<button class="btn btn-primary" onclick="openWorkspace('${em.opp}');closeDrawer()">Open deal</button>`}<button class="btn btn-secondary">Request more info</button><button class="btn btn-ghost" style="color:var(--danger)">Not a deal</button><button class="btn btn-ghost" onclick="closeDrawer()" style="margin-left:auto">Cancel</button></div>`;
  renderApp();
}

function createDeal(emailId){
  const em=EMAILS.find(e=>e.id===emailId);if(!em)return;
  toast(`Deal record created for ${em.company}. Assigned to inbox.`,'success');closeDrawer();
}

// ============================================================
// UI HELPERS
// ============================================================
function toast(msg,type='info',dur=4500){
  let c=document.getElementById('toast-container');
  if(!c){c=document.createElement('div');c.id='toast-container';document.body.appendChild(c)}
  const id='t'+Date.now();const el=document.createElement('div');el.className=`toast ${type}`;el.id=id;
  el.innerHTML=`<span style="flex:1">${msg}</span><button onclick="document.getElementById('${id}')?.remove()" style="background:none;border:none;cursor:pointer;color:var(--t400);font-size:16px;padding:0 0 0 8px;flex-shrink:0">×</button>`;
  c.appendChild(el);setTimeout(()=>el.remove(),dur);
}

let _mbfns=[];
function showModal(title,body,buttons){
  _mbfns=buttons.map(b=>new Function(b.fn));
  STATE.modalOpen=true;
  STATE.modalContent=`<div class="mo-header"><div class="mo-title">${title}</div><button class="btn btn-ghost btn-icon" onclick="closeModal()">${icon('x',15)}</button></div><div class="mo-body">${body}</div><div class="mo-footer">${buttons.map((b,i)=>`<button class="btn ${b.cls}" onclick="_mbfns[${i}]()">${b.lbl}</button>`).join('')}</div>`;
  renderApp();
}

function closeDrawer(){STATE.drawerOpen=false;STATE.drawerContent=''}
function closeModal(){STATE.modalOpen=false;STATE.modalContent=''}
function openWorkspace(oppId){STATE.workspaceOpen=true;STATE.workspaceOpp=oppId;STATE.workspaceTab='overview';closeDrawer();closeModal();renderApp()}
function closeWorkspace(){STATE.workspaceOpen=false;STATE.workspaceOpp=null;renderApp()}
function toggleMenu(e){e.stopPropagation();STATE.userMenuOpen=!STATE.userMenuOpen;const m=document.getElementById('user-menu');if(m)m.classList.toggle('open',STATE.userMenuOpen)}
function doReset(){location.reload()}
function doClear(){toast('Session cleared (demo – no persistent data)','info');STATE.userMenuOpen=false;const m=document.getElementById('user-menu');if(m)m.classList.remove('open')}

function newDeal(){showModal('New Deal',`<div class="form-group"><div class="form-label">Company name</div><input type="text" style="width:100%" placeholder="Company name…"></div><div class="form-group"><div class="form-label">Project name</div><input type="text" style="width:100%" placeholder="Project or transaction name…"></div><div class="form-group"><div class="form-label">Sector</div><input type="text" style="width:100%" placeholder="Sector…"></div><div class="form-group"><div class="form-label">Geography</div><input type="text" style="width:100%" placeholder="Country or region…"></div><div class="notice notice-warn" style="font-size:12px">Use synthetic or non-confidential demonstration material only.</div>`,[{lbl:'Create deal',cls:'btn-primary',fn:"toast('Deal record created.','success');closeModal()"},{lbl:'Cancel',cls:'btn-secondary',fn:'closeModal()'}])}

function saveApiKey(){
  const inp=document.getElementById('api-key-input');
  if(!inp)return;
  const k=inp.value.trim();
  if(!k){toast('Please enter an API key.','warn');return}
  if(!k.startsWith('sk-ant-')){toast('Key should start with sk-ant-. Please check and try again.','warn');return}
  STATE.apiKey=k;
  try{localStorage.setItem('ns_apikey',k)}catch(e){}
  toast('API key saved. Live AI generation enabled.','success');
  renderApp();
}

function removeApiKey(){
  STATE.apiKey='';
  try{localStorage.removeItem('ns_apikey')}catch(e){}
  toast('API key removed.','info');
  renderApp();
}

async function testApiKey(){
  if(!STATE.apiKey){toast('No API key configured.','warn');return}
  toast('Testing connection…','info',2000);
  const r=await callClaude('Say "Connection successful" in exactly those two words.');
  if(r.success){toast('Connection successful. API key is valid.','success')}
  else{toast('Connection failed: '+r.error,'danger')}
}

function logEvent(data){
  ACTIVITY_LOG.unshift({id:'EVT'+String(ACTIVITY_LOG.length+1).padStart(3,'0'),timestamp:new Date().toISOString(),actor:USERS[STATE.currentUser]?.name||'Demo Analyst',...data,conditions:data.conditions||'',error:null,parentEvent:null,environment:'DEMO',dataClassification:'Synthetic',retention:'Demo session only'});
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded',()=>{
  document.addEventListener('click',e=>{
    if(STATE.userMenuOpen&&!e.target.closest('.user-card')){
      STATE.userMenuOpen=false;const m=document.getElementById('user-menu');if(m)m.classList.remove('open');
    }
  });
  renderApp();
  // Brief welcome toast
  setTimeout(()=>toast('Northstar Investment Intelligence · Demo environment · All data synthetic','info',5000),600);
});
</script>
